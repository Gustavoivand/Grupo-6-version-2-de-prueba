# ============================================================================
# BOOKMATE - CONFIGURACIÓN SPRING BOOT
# Track: BASIC (Prototipo Estático)
# ============================================================================

# Configuración del servidor
server.port=8080
server.address=localhost

# Nombre de la aplicación
spring.application.name=BookMate-Basic

# Configuración de archivos estáticos
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# Configuración de DevTools (recarga automática)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.bookmate=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Banner personalizado
spring.main.banner-mode=off

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuración de sesiones (por si se implementa login server-side en el futuro)
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=BOOKMATE_SESSION

# Configuración de compresión (mejora performance)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024





